[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "switchyard-langchain"
version = "0.1.0"
description = "Experimental LangChain middleware for Switchyard libsy routing"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "nemo-switchyard>=0.2.0",
    "langchain>=1.3.14,<2",
]

[project.optional-dependencies]
deepagents = [
    "deepagents>=0.7.4,<0.8",
]
openrouter = [
    "deepagents>=0.7.4,<0.8",
    "langchain-openrouter>=0.2.7,<0.3",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<1",
]

[tool.uv.sources]
nemo-switchyard = { path = "../../..", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = '-m "not e2e"'
markers = [
    "e2e: makes paid calls to real OpenRouter models",
]

[tool.mypy]
python_version = "3.12"
strict = true
